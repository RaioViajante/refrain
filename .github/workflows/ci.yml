name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: CI checks out and verifies code. It never writes, publishes, or deploys.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The new application at the repository root. The archived music diary
# (archive/music-diary-v3/) is not built or tested here: its own workflow is
# kept, inert, at archive/music-diary-v3/.github/workflows/ci.yml, and its
# last verified state is the tag music-diary-v3-final.
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    # Disposable database for integration tests (the same as compose.yaml's
    # postgres-test). src/db/env.ts refuses any database not named *_test.
    services:
      postgres-test:
        image: postgres:17.11-trixie
        env:
          POSTGRES_USER: refrain_test
          POSTGRES_PASSWORD: refrain_test
          POSTGRES_DB: refrain_mixtapes_test
        ports:
          - 5443:5432
        options: >-
          --health-cmd "pg_isready -U refrain_test -d refrain_mixtapes_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      # Actions are pinned to full commit SHAs; the comment names the release.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The design reference and the local importer are local-only (decision
      # 0002); nothing under reference/ or local/, and no archive, is tracked.
      - name: No design reference tracked
        run: |
          tracked="$(git ls-files -- reference local ':(glob)**/*.zip')"
          if [ -n "$tracked" ]; then
            echo "$tracked"
            echo "::error::Files under reference/ or local/, or .zip archives, are tracked. They are local-only."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (PostgreSQL)
        run: pnpm test:db

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      # The committed migrations must match the Drizzle schema. Neither command
      # connects to a database; the config only requires a well-formed local URL.
      - name: Schema consistency
        run: |
          pnpm db:check
          pnpm db:generate
          if [ -n "$(git status --porcelain -- src/db)" ]; then
            git status --porcelain -- src/db
            echo "::error::src/db/schema.ts has changes without a committed migration. Run pnpm db:generate and commit the result."
            exit 1
          fi
        env:
          DATABASE_URL: postgres://unused:unused@127.0.0.1:5432/unused

      # DATABASE_URL is deliberately absent: the build must not need a database.
      - name: Production build
        run: pnpm build
