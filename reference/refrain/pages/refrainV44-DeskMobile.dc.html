/* ── V4.3 system: listings + studio ─────────────────────── */
.ph1{margin:0;font-family:'Kalam',cursive;font-weight:700;font-size:58px;line-height:1.05;letter-spacing:-.005em}
.lead2{margin:12px 0 0;max-width:46ch;font-size:19px;line-height:1.55;color:#3A3A3A}
.seg3{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:17px}
.seg3 button{background:none;border:0;margin:0;padding:10px 0 8px;min-height:44px;font-family:'Alegreya Sans',sans-serif;font-size:17px;color:#4A4A4A;cursor:pointer;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20200%2010%22%20preserveAspectRatio%3D%22none%22%3E%3Cpath%20d%3D%22M2.3%206.6%20C12.3%206.3%2C39.3%202.8%2C60.7%202.8%20C82.1%202.8%2C108.2%206.5%2C130.9%206.6%20C153.5%206.7%2C185.5%204%2C196.7%203.4%20M0.6%205.7%20C10.7%205.7%2C38.3%204.2%2C59.9%204.5%20C81.5%204.9%2C107.6%208%2C130.4%208%20C153.1%208%2C185.3%205.4%2C196.3%204.5%22%20fill%3D%22none%22%20stroke%3D%22%23111%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E");background-repeat:no-repeat;background-position:0 100%;background-size:0% 7px;transition:background-size .3s ease}
.seg3 button:hover{color:#111}
.seg3 button[aria-pressed="true"]{color:#111;background-size:100% 7px}
.prog{font-size:16px;color:#4A4A4A}
.albs.a3{grid-template-columns:repeat(3,minmax(0,1fr))}
.arjs.a2{grid-template-columns:repeat(2,minmax(0,1fr))}
.arj.big{grid-template-columns:120px minmax(0,1fr)}
.v4 a.plain{text-decoration:none}
/* status: published = filled ink dot, private = drawn circle, draft = dotted circle. Always with a word. */
.chip{display:inline-flex;align-items:center;gap:7px;font-size:15.5px;line-height:1.3;color:#2E2E2E;white-space:nowrap}
.chip svg{flex:0 0 auto;overflow:visible}
.chip svg circle,.chip svg path{fill:none;stroke:#111;stroke-width:1.3;vector-effect:non-scaling-stroke}
.chip.pub svg circle{fill:#111;stroke:none}
.chip.drf svg circle{stroke-dasharray:2 2.4}
/* private header */
.pvt{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:#3A3A3A}
/* editor bar */
.ebar{position:sticky;top:0;z-index:6;background:rgba(255,255,255,.97);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding:12px 0 10px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:16.5px}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hb:not(.pri) .o .fl{display:none}
.fld.wa .o path{stroke:#ABABAB}
.fld.wa:focus-within .o path{stroke:#111}
.st-grid.g3{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.hb.sm2{min-height:42px;padding:0 16px;font-size:16.5px}
.hb.q{padding:0 10px}
.hb.q .o{display:none}
.hb.q:hover{text-decoration:underline;text-underline-offset:5px}
.saved{font-size:15.5px;color:#4A4A4A}
/* studio layout: one writing column + a margin of settings */
.studio{display:grid;grid-template-columns:minmax(0,1fr) 300px;column-gap:80px;row-gap:44px;align-items:start;padding:44px 0 96px}
.wcol{min-width:0;max-width:760px;display:flex;flex-direction:column;gap:34px}
.side{display:flex;flex-direction:column;gap:30px;font-size:16.5px;line-height:1.5}
.side .blk{display:flex;flex-direction:column;gap:10px}
.lbl3{display:block;font-family:'Kalam',cursive;font-weight:400;font-size:20px;line-height:1.3;color:#111;margin:0 0 8px}
.hint3{display:block;margin-top:8px;font-size:15.5px;line-height:1.5;color:#4F4F4F}
.ti-in{width:100%;background:none;border:0;margin:0;padding:4px 0 10px;font-family:'Kalam',cursive;font-weight:700;font-size:52px;line-height:1.15;color:#111;outline:none}
.ti-in::placeholder{color:#9A9A9A}
.ti-wrap{position:relative}
.ti-wrap .rule{position:absolute;left:0;right:0;bottom:0}
.ti-wrap:focus-within .rule path{stroke:#111;stroke-width:1.6}
.le-in{width:100%;background:none;border:0;margin:0;padding:4px 0 12px;font-family:'Kalam',cursive;font-weight:300;font-size:30px;line-height:1.35;color:#111;outline:none;resize:none}
.fld textarea.wr{font-family:'Alegreya Sans',sans-serif;font-size:21px;line-height:1.7;padding:26px 30px;min-height:420px}
.fld textarea.wr.s{min-height:150px;font-size:19px;padding:18px 20px}
.fld select{cursor:pointer}
.wc{font-size:15.5px;color:#4F4F4F;font-variant-numeric:tabular-nums}
.dlg3{position:relative;isolation:isolate;background:#FFFFFF;padding:26px 28px 24px;max-width:540px}
.dlg3 h3{margin:0;font-family:'Kalam',cursive;font-weight:700;font-size:25px;line-height:1.25}
.dlg3 p{margin:8px 0 18px;font-size:17.5px;line-height:1.55;color:#2E2E2E}
.note3{position:relative;isolation:isolate;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;padding:14px 18px;background:#FFFFFF;font-size:17px}
.trw{display:grid;grid-template-columns:44px minmax(0,1fr) auto 24px;gap:6px 14px;align-items:center;width:100%;background:none;border:0;margin:0;padding:14px 4px;text-align:left;font-family:inherit;color:#111;cursor:pointer}
.trw:hover{background:#F7F7F5}
.trw .tn{font-size:20px}
.trw .tt{font-size:21px}
.tred{padding:4px 4px 26px 58px;display:flex;flex-direction:column;gap:14px}
.rate{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.lrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:4px 18px;align-items:center;padding:14px 2px}
.v4 a.lrow{text-decoration:none}
a.lrow:hover .ti{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.lrow .ti{font-family:'Kalam',cursive;font-size:22px;line-height:1.3}
.lrow .mt{font-size:16px;color:#4A4A4A}
.skel{display:block;height:12px;background:#EFEFED;border-radius:6px}
.panel{background:#F6F6F4;padding:28px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.st-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 56px}
.st-grid h2{margin:0 0 14px;font-family:'Kalam',cursive;font-weight:400;font-size:21px;color:#3A3A3A}
.ddrop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:7;background:#FFFFFF;padding:8px 0;isolation:isolate}
.ddrop .opt{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;background:none;border:0;margin:0;padding:8px 16px;min-height:52px;text-align:left;font-family:inherit;font-size:17px;color:#111;cursor:pointer}
.ddrop .opt:hover,.ddrop .opt:focus-visible{background:#F7F7F5}
.ddrop .grp{display:block;padding:8px 16px 4px;font-size:15px;color:#4F4F4F}
@media (max-width:720px){
 .ph1{font-size:42px}
 .studio{grid-template-columns:minmax(0,1fr);padding:28px 0 72px}
 .ti-in{font-size:30px}
 .le-in{font-size:24px}
 .fld textarea.wr{font-size:19px;padding:18px;min-height:320px}
 .ebar{padding:10px 0}
 .crumb{font-size:16px}
 .trw{grid-template-columns:30px minmax(0,1fr) 22px}
 .trw .tm{grid-column:2;grid-row:2}
 .trw .tc{grid-column:3;grid-row:1}
 .tred{padding:0 2px 22px 40px}
 .lrow{grid-template-columns:48px minmax(0,1fr);gap:2px 14px}
 .lrow .rgt{grid-column:2}
 .st-grid,.st-grid.g3{grid-template-columns:minmax(0,1fr);gap:40px}
 .panel{padding:20px}
 .dlg3{padding:22px 20px}
 .ofirst{order:-1}
 .albs.a3{grid-template-columns:repeat(2,minmax(0,1fr))}
 .arjs.a2{grid-template-columns:minmax(0,1fr)}
 .arj.big{grid-template-columns:84px minmax(0,1fr)}
}

/* ── V4.4 ─────────────────────────────────────── */
.hdr4{display:flex;justify-content:center;padding:22px 0 0}
.hdr4 .nav{flex-wrap:wrap;justify-content:center;gap:4px 34px}
.opening{display:flex;flex-direction:column;align-items:center;padding-top:44px}
.char{display:block;width:380px;max-width:100%;height:auto;aspect-ratio:1536/1024}
.opening .hi{margin:16px auto 0;max-width:33em;text-align:center}
.opening .since{justify-content:center}
.ft4{display:flex;flex-direction:column;align-items:center;gap:4px;padding:30px 0 44px;text-align:center}
.ft4 .tag{margin:0;font-family:'Kalam',cursive;font-weight:400;font-size:21px;line-height:1.4;color:#2A2A2A}
.ft4 .lb{font-family:'Alegreya Sans',sans-serif;font-size:17px;padding:10px 6px}
.ft4 .lmenu{left:50%;right:auto;transform:translateX(-50%)}
@media (max-width:720px){
 .hdr4{padding-top:16px}
 .hdr4 .nav{gap:2px 22px}
 .opening{padding-top:30px}
 .char{width:300px}
 .opening .hi{margin-top:10px}
 .ft4 .tag{font-size:19.5px}
}
@media (max-width:370px){
 .hdr4 .nav{gap:2px 16px;font-size:18px}
 .char{width:280px}
}
@media (max-width:720px){.hdr>a.ink{justify-self:center!important}}</style>
