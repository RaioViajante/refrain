# Local databases only. Never use these settings in production.
# Values come from .env (copy .env.example). See docs/development.md.
name: refrain

services:
  postgres:
    image: postgres:17.11-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-refrain}
    ports:
      # Reachable from this machine only, not from the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP check: during first-time initialization the server accepts only
      # socket connections, so it is not reported healthy too early.
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Give PostgreSQL time to shut down cleanly before Docker kills it.
    stop_grace_period: 1m

  # Disposable database for integration tests. It is a separate server with
  # its own credentials and no volume: its data lives in memory (tmpfs) and is
  # discarded whenever the container stops. It starts only on request
  # (`pnpm db:test:up`), never with `pnpm db:up`.
  postgres-test:
    image: postgres:17.11-trixie
    profiles: [test]
    environment:
      POSTGRES_USER: refrain_test
      POSTGRES_PASSWORD: refrain-test-local-only
      POSTGRES_DB: refrain_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      # Marks the database as disposable; the tests refuse unmarked databases.
      - ./docker/postgres-test:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: reported healthy only after initialization, including the
      # marker script, has finished.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U refrain_test -d refrain_test",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
