# Local database only. Never use these settings in production.
# Values come from .env (copy .env.example).
#
# The project name and port differ from the archived application's
# (archive/music-diary-v3/compose.yaml: project "refrain", port 5432), so this
# file never starts, stops, or reuses that application's local volumes.
name: refrain-mixtapes

services:
  postgres:
    image: postgres:17.11-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refrain_mixtapes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-refrain_mixtapes}
    ports:
      # Reachable from this machine only, not from the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 1m

  # Disposable database for integration tests (pnpm test:db). Its data lives in
  # memory and disappears when the container stops; the credentials below are
  # for this throwaway database only. Tests refuse any database whose name
  # does not end in _test (src/db/env.ts).
  postgres-test:
    image: postgres:17.11-trixie
    environment:
      POSTGRES_USER: refrain_test
      POSTGRES_PASSWORD: refrain_test
      POSTGRES_DB: refrain_mixtapes_test
    ports:
      - "127.0.0.1:5443:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U refrain_test -d refrain_mixtapes_test",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
