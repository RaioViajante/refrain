# Local development database only. Never use these settings in production.
# Values come from .env (copy .env.example). See docs/development.md.
name: refrain

services:
  postgres:
    image: postgres:17.11-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-refrain}
    ports:
      # Reachable from this machine only, not from the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP check: during first-time initialization the server accepts only
      # socket connections, so it is not reported healthy too early.
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Give PostgreSQL time to shut down cleanly before Docker kills it.
    stop_grace_period: 1m

volumes:
  postgres-data:
